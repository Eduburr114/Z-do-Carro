# Configuração do Fly.io para o Zé do Carro.
# Criar o app (uma vez): fly launch --no-deploy --copy-config --name ze-do-carro --region gru
# Segredos (nunca no arquivo): fly secrets set SUPABASE_SECRET_KEY=... VAPID_PRIVATE_KEY=... VAPID_SUBJECT=...
#   e, para o financeiro: ASAAS_API_KEY=... ASAAS_WEBHOOK_TOKEN=... ASAAS_TRANSFER_VALIDATION_TOKEN=...
#   CRON_SECRET=... RESEND_API_KEY=... (veja docs/FINANCEIRO.md)
app = "ze-do-carro"
primary_region = "gru"

[build]
  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://SEU-PROJETO.supabase.co"
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SUBSTITUIR"
    NEXT_PUBLIC_VAPID_PUBLIC_KEY = ""

[env]
  SESSION_IDLE_MINUTES = "30"
  APP_URL = "https://ze-do-carro.fly.dev"
  ASAAS_ENV = "sandbox"
  EMAIL_FROM = "Zé do Carro <nao-responda@seu-dominio.com.br>"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.home]
    type = "http"
    port = 3000
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/login"
